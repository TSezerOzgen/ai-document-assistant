<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Asistan</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --cizgi:#282d38;
    --metin:#e7eaf0; --soluk:#8b93a7; --vurgu:#4f8cff; --yesil:#3ecf8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--metin);
    height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .kutu{
    width:100%; max-width:560px; height:min(760px,95vh);
    background:var(--panel); border:1px solid var(--cizgi); border-radius:16px;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  header{
    padding:16px 20px; border-bottom:1px solid var(--cizgi);
    display:flex; align-items:center; gap:12px; background:var(--panel2);
  }
  .avatar{
    width:40px;height:40px;border-radius:50%;flex:none;
    background:linear-gradient(135deg,var(--vurgu),#9d6bff);
    display:flex;align-items:center;justify-content:center;font-size:19px;
  }
  .baslik{font-weight:600;font-size:15px}
  .durum{font-size:12px;color:var(--yesil);display:flex;align-items:center;gap:5px;margin-top:2px}
  .nokta{width:6px;height:6px;border-radius:50%;background:var(--yesil)}

  #akis{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
  .satir{display:flex;max-width:85%}
  .satir.ben{align-self:flex-end}
  .satir.bot{align-self:flex-start}
  .balon{padding:11px 15px;border-radius:16px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
  .ben .balon{background:var(--vurgu);color:#fff;border-bottom-right-radius:5px}
  .bot .balon{background:var(--panel2);border:1px solid var(--cizgi);border-bottom-left-radius:5px}

  .yaziyor{display:flex;gap:4px;padding:14px 16px}
  .yaziyor i{width:7px;height:7px;border-radius:50%;background:var(--soluk);animation:zipla 1.2s infinite}
  .yaziyor i:nth-child(2){animation-delay:.2s}
  .yaziyor i:nth-child(3){animation-delay:.4s}
  @keyframes zipla{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

  .oneriler{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 12px}
  .oneri{
    background:var(--panel2);border:1px solid var(--cizgi);color:var(--soluk);
    padding:7px 12px;border-radius:20px;font-size:12.5px;cursor:pointer;transition:.15s;
  }
  .oneri:hover{border-color:var(--vurgu);color:var(--metin)}

  footer{padding:14px 16px;border-top:1px solid var(--cizgi);background:var(--panel2)}
  .giris{display:flex;gap:9px}
  input{
    flex:1;background:var(--panel);border:1px solid var(--cizgi);color:var(--metin);
    padding:12px 15px;border-radius:10px;font-size:14.5px;outline:none;font-family:inherit;
  }
  input:focus{border-color:var(--vurgu)}
  button{
    background:var(--vurgu);border:0;color:#fff;padding:0 18px;border-radius:10px;
    font-size:15px;cursor:pointer;font-family:inherit;
  }
  button:disabled{opacity:.4;cursor:not-allowed}
  .maliyet{font-size:11px;color:var(--soluk);margin-top:9px;text-align:center;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="kutu">
  <header>
    <div class="avatar">&#129302;</div>
    <div>
      <div class="baslik" id="isim">AI Asistan</div>
      <div class="durum"><span class="nokta"></span> cevrimici &middot; 7/24</div>
    </div>
  </header>

  <div id="akis"></div>

  <div class="oneriler" id="oneriler"></div>

  <footer>
    <div class="giris">
      <input id="kutu" placeholder="Mesajinizi yazin..." autocomplete="off">
      <button id="gonder">&#10148;</button>
    </div>
    <div class="maliyet" id="maliyet">Toplam: 0,00 kurus</div>
  </footer>
</div>

<script>
const akis = document.getElementById('akis');
const kutu = document.getElementById('kutu');
const gonder = document.getElementById('gonder');
const maliyetYazi = document.getElementById('maliyet');
let gecmis = [];
let toplamKurus = 0;

const ONERILER = ["Kacta aciksiniz?", "Fiyatlariniz nedir?", "Yarin randevu alabilir miyim?", "Neredesiniz?"];

fetch('/bilgi').then(r=>r.json()).then(b=>{
  document.getElementById('isim').textContent = b.isletme;
});

ONERILER.forEach(t=>{
  const d = document.createElement('div');
  d.className='oneri'; d.textContent=t;
  d.onclick=()=>{ kutu.value=t; sor(); };
  document.getElementById('oneriler').appendChild(d);
});

function balonEkle(kim, metin){
  const satir = document.createElement('div');
  satir.className = 'satir ' + kim;
  const b = document.createElement('div');
  b.className='balon'; b.textContent = metin;
  satir.appendChild(b); akis.appendChild(satir);
  akis.scrollTop = akis.scrollHeight;
  return b;
}

balonEkle('bot','Merhaba! Size nasil yardimci olabilirim?');

async function sor(){
  const soru = kutu.value.trim();
  if(!soru) return;

  balonEkle('ben', soru);
  gecmis.push({role:'user', content:soru});
  kutu.value=''; kutu.disabled=true; gonder.disabled=true;

  const satir = document.createElement('div');
  satir.className='satir bot';
  satir.innerHTML = '<div class="balon"><div class="yaziyor"><i></i><i></i><i></i></div></div>';
  akis.appendChild(satir);
  akis.scrollTop = akis.scrollHeight;

  let balon = null, cevap = '';

  try{
    const y = await fetch('/sor',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({mesajlar: gecmis})
    });

    const okuyucu = y.body.getReader();
    const cozucu = new TextDecoder();
    let tampon = '';

    while(true){
      const {done, value} = await okuyucu.read();
      if(done) break;
      tampon += cozucu.decode(value, {stream:true});
      const satirlar = tampon.split('\n');
      tampon = satirlar.pop();

      for(const s of satirlar){
        if(!s.trim()) continue;
        const p = JSON.parse(s);

        if(p.tip === 'metin'){
          if(!balon){ satir.innerHTML=''; balon=document.createElement('div'); balon.className='balon'; satir.appendChild(balon); }
          cevap += p.veri;
          balon.textContent = cevap;
          akis.scrollTop = akis.scrollHeight;
        }
        else if(p.tip === 'maliyet'){
          toplamKurus += p.kurus;
          maliyetYazi.textContent =
            `Bu soru: ${p.kurus.toFixed(2)} kurus  |  Toplam: ${toplamKurus.toFixed(2)} kurus  |  onbellek: ${p.onbellek_okundu} token`;
        }
        else if(p.tip === 'hata'){
          if(!balon){ satir.innerHTML=''; balon=document.createElement('div'); balon.className='balon'; satir.appendChild(balon); }
          balon.textContent = 'HATA: ' + p.veri;
        }
      }
    }
    if(cevap) gecmis.push({role:'assistant', content:cevap});
  }catch(e){
    satir.innerHTML = '<div class="balon">Baglanti hatasi: '+e.message+'</div>';
  }

  kutu.disabled=false; gonder.disabled=false; kutu.focus();
}

gonder.onclick = sor;
kutu.onkeydown = e => { if(e.key === 'Enter') sor(); };
kutu.focus();
</script>
</body>
</html>
